name: CopyBoss read-only external network audit
on:
  push:
    branches:
      - alex-audit/copyboss-network-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: DNS / TLS / HTTP response check (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run public network checks, without deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import os, ssl, socket, urllib.request, urllib.error, json, datetime
          hosts = ["www.copy-boss.com","copy-boss.com","copyboss-live.onrender.com"]
          urls = [
           "https://www.copy-boss.com/",
           "https://www.copy-boss.com/analyzer.html",
           "https://www.copy-boss.com/_prod/analyzer.html",
           "https://www.copy-boss.com/login.html",
           "https://www.copy-boss.com/pricing.html",
           "https://www.copy-boss.com/support.html",
           "https://www.copy-boss.com/sitemap.xml",
           "https://www.copy-boss.com/robots.txt",
           "https://www.copy-boss.com/assets/img/mascot.png",
           "https://copy-boss.com/",
           "http://copy-boss.com/",
           "https://copyboss-live.onrender.com/"
          ]
          results = []
          def record(kind, target, **data):
              entry = {"kind":kind, "target":target, **data}
              results.append(entry)
              print(json.dumps(entry, ensure_ascii=False), flush=True)
          for host in hosts:
              try:
                  ips = sorted({x[4][0] for x in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
                  record("dns", host, addresses=ips[:8])
              except Exception as e:
                  record("dns", host, error=repr(e))
              try:
                  with socket.create_connection((host, 443), timeout=8) as raw:
                      with ssl.create_default_context().wrap_socket(raw, server_hostname=host) as s:
                          cert=s.getpeercert()
                          record("tls",host,protocol=s.version(),expires=cert.get("notAfter"),subject=str(cert.get("subject", ""))[:200])
              except Exception as e:
                  record("tls", host, error=repr(e))
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"CopyBoss-ReadOnly-SEO-Audit/1.0"})
                  with urllib.request.urlopen(req,timeout=12) as resp:
                      resp.read(16)
                      record("http",url,status=resp.status,final_url=resp.url,content_type=resp.headers.get("content-type"),content_length=resp.headers.get("content-length"))
              except urllib.error.HTTPError as e:
                  record("http",url,status=e.code,error=str(e.reason),final_url=e.url)
              except Exception as e:
                  record("http",url,error=repr(e))
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a") as f:
                  f.write("# CopyBoss external read-only DNS / TLS / HTTP audit\\n\\n")
                  f.write("This diagnostic did not deploy code, submit forms, access accounts or modify websites.\\n\\n")
                  f.write("| Probe | Target | Result |\\n|---|---|---|\\n")
                  for r in results:
                      data= ("HTTP " + str(r.get("status")) + " to " + r.get("final_url","")) if "status" in r else ("TLS " + str(r.get("protocol")) + " until " + str(r.get("expires",""))) if r["kind"]=="tls" and "error" not in r else "ERROR: "+str(r.get("error","")) if "error" in r else ", ".join(r.get("addresses",[]))
                      f.write("| "+r["kind"]+" | "+r["target"]+" | "+data.replace("|","/")+" |\\n")
          print("Audit finished; this read-only diagnostic intentionally does not fail the workflow.",flush=True)
          PY
      - name: Install isolated browser test dependencies
        shell: bash
        run: |
          mkdir -p /tmp/copyboss-browser-audit
          npm install --prefix /tmp/copyboss-browser-audit --no-audit --no-fund --silent playwright
          if command -v google-chrome >/dev/null; then
            echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            /tmp/copyboss-browser-audit/node_modules/.bin/playwright install chromium
          fi
      - name: Read-only browser smoke test of current production
        shell: bash
        run: |
          node - <<'NODE'
          const { chromium } = require('/tmp/copyboss-browser-audit/node_modules/playwright');
          (async () => {
            const opt = {headless: true, args:['--no-sandbox']};
            if(process.env.CHROME_EXECUTABLE) opt.executablePath=process.env.CHROME_EXECUTABLE;
            const browser = await chromium.launch(opt);
            const context = await browser.newContext({viewport:{width:1365,height:768}});
            const routes = [
              ['/', 'CopyBoss - AI Video Analyzer for Creators'],
              ['/analyzer.html', 'VideoBoss Analyzer - AI Video Analysis Tool'],
              ['/_prod/analyzer.html', 'VideoBoss Analyzer - AI Video Analysis Tool'],
              ['/login.html', 'Login - CopyBoss'],
              ['/pricing.html', 'CopyBoss Pricing - Choose Your Plan'],
              ['/support.html', 'Support - CopyBoss']
            ];
            let failed=0;
            for(const [path,title] of routes){
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror', err => pageErrors.push(err.message.slice(0,180)));
              try{
                const response = await page.goto('https://www.copy-boss.com'+path,{waitUntil:'domcontentloaded',timeout:45000});
                const actual = await page.title();
                const body = await page.locator('body').count();
                const status = response?.status();
                const result = {path,status,title:actual,bodyPresent:!!body,finalUrl:page.url(),runtimeErrors:pageErrors.slice(0,4)};
                const passed=status===200&&actual===title&&body>0;
                result.pass=passed;
                if(!passed)failed++;
                console.log('BROWSER_CHECK '+JSON.stringify(result));
              }catch(e){
                failed++;
                console.log('BROWSER_CHECK '+JSON.stringify({path,pass:false,error:String(e).slice(0,220)}));
              }finally{await page.close();}
            }
            const affiliate=await context.newPage();
            try{
              const res=await affiliate.goto('https://www.copy-boss.com/affiliate-dashboard.html',{waitUntil:'domcontentloaded',timeout:45000});
              await affiliate.waitForTimeout(2500);
              console.log('AFFILIATE_REDIRECT '+JSON.stringify({initialStatus:res?.status(),finalUrl:affiliate.url()}));
            }catch(e){console.log('AFFILIATE_REDIRECT '+JSON.stringify({error:String(e).slice(0,200)}));}
            await browser.close();
            console.log('BROWSER_SUMMARY '+JSON.stringify({passed:routes.length-failed,total:routes.length,failed,modifiesProduction:false}));
            if(failed>0)process.exitCode=1;
          })().catch(err => {console.error('BROWSER_FATAL',String(err));process.exitCode=1});
          NODE
