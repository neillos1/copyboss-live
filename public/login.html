<html lang="en">
<head>

  <title>Login - CopyBoss</title>
  <meta name="description" content="Log in to your CopyBoss account to access AI-powered video analysis, script generation, and your personalized dashboard.">
  
  <!-- ✅ Open Graph (Facebook, LinkedIn) -->
  <meta property="og:title" content="CopyBoss Login - Access Your Dashboard">
  <meta property="og:description" content="Log in to CopyBoss and continue analyzing videos, generating scripts, and tracking your content performance.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://copy-boss.com/login.html">
  <meta property="og:image" content="https://copy-boss.com/assets/img/og-login.png">

  <!-- ✅ Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CopyBoss Login - Access Your Dashboard">
  <meta name="twitter:description" content="Log in to continue using CopyBoss video analyzer, script generator, and dashboard tools.">

  <link rel="shortcut icon" type="image/png" href="/assets/img/favicon.png?v=3">
  <link rel="apple-touch-icon" type="image/png" href="/assets/img/favicon.png?v=3">

  <style>
    body {
      background: linear-gradient(135deg, #0e0e2c 0%, #1a1a3a 50%, #0e0e2c 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    /* Particle Animation */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    /* Loading Spinner */
    #loadingOverlay {
      display: none;
      align-items: center;
      justify-content: center;
    }
    .loader {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #3B82F6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
        opacity: 0.8;
      }
    }
    
    .login-container {
      background: rgba(30, 30, 64, 0.9);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo-section img {
      height: 40px;
      width: auto;
      margin-right: 10px;
    }
    
    .logo-section h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      padding: 12px 16px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      color: #fff;
    }
    
    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    
    .signup-link {
      text-align: center;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.7);
    }
    
    .signup-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    
    .signup-link a:hover {
      text-decoration: underline;
    }
    
    .alert {
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
    }
    
    .alert-danger {
      background: rgba(220, 53, 69, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(220, 53, 69, 0.3);
    }







    .modal.show {
        opacity: 1;
        visibility: visible;
    }

    .modal.hidden {
        opacity: 0;
        visibility: hidden;
    }

    .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
    }

    .modal-content {
        position: relative;
        background: linear-gradient(135deg, rgba(30, 30, 64, 0.95) 0%, rgba(20, 20, 40, 0.95) 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 0;
        max-width: 90%;
        width: 600px;
        max-height: 80vh;
        overflow: hidden;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        transform: translateY(20px);
        transition: transform 0.3s ease;
    }

    .modal.show .modal-content {
        transform: translateY(0);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 32px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
    }

    .modal-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: white;
        margin: 0;
    }

    .modal-close {
        background: none;
        border: none;
        color: #8fa3c7;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 8px;
        border-radius: 8px;
        transition: all 0.2s ease;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal-close:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
    }

    .modal-body {
        padding: 32px;
        max-height: calc(80vh - 120px);
        overflow-y: auto;
    }

    .modal-summary {
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 24px;
    }

    .modal-summary p {
        margin: 0;
        color: #e2e8f0;
        font-size: 0.95rem;
        line-height: 1.5;
    }

    .modal-content-text h3 {
        color: white;
        font-size: 1.25rem;
        font-weight: 600;
        margin: 24px 0 12px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
    }

    .modal-content-text h4 {
        color: #e2e8f0;
        font-size: 1.1rem;
        font-weight: 500;
        margin: 20px 0 8px 0;
    }

    .modal-content-text p {
        color: #cbd5e1;
        line-height: 1.6;
        margin: 12px 0;
    }

    .modal-content-text ul {
        color: #cbd5e1;
        line-height: 1.6;
        margin: 12px 0;
        padding-left: 20px;
    }

    .modal-content-text li {
        margin: 6px 0;
    }

    /* Scrollbar styling for modal */
    .modal-body::-webkit-scrollbar {
        width: 6px;
    }

    .modal-body::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
    }

    .modal-body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
    }

    .modal-body::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    /* Responsive modal */
    @media (max-width: 768px) {
        .modal-content {
            width: 95%;
            max-height: 90vh;
        }

        .modal-header {
            padding: 20px 24px;
        }

        .modal-body {
            padding: 24px;
            max-height: calc(90vh - 100px);
        }

        .modal-title {
            font-size: 1.25rem;
        }
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden">
    <div class="loader"></div>
  </div>
  
  <div class="particles" id="particles"></div>
  <div class="login-container">
    <div class="logo-section">
      <img src="assets/img/mascot.png" alt="CopyBoss">
      <h1>CopyBoss</h1>
    </div>
    
    <h2 class="text-center mb-4">Welcome Back</h2>
    
    <div id="alertContainer"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <input type="email" id="email" class="form-control" placeholder="Email address" required />
      </div>
      
      <div class="form-group">
        <input type="password" id="password" class="form-control" placeholder="Password" required />
      </div>
      
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;">
        <input type="checkbox" id="rememberMe"> Remember me
      </label>
      
      <button type="button" class="btn btn-primary" id="signInBtn" onclick="simpleLogin()">Sign In</button>
    </form>
    
    <div class="signup-link">
      Don't have an account? <a href="signup.html" id="signupLink">Sign up</a>
    </div>
  </div>

  <!-- Auth System -->
  <script src="auth.js"></script>

  <script>
    // UNIFIED LOGIN FUNCTION
    async function simpleLogin() {
      console.log('=== LOGIN ATTEMPT STARTED ===');
      console.log('Current hostname:', window.location.hostname);
      console.log('Current URL:', window.location.href);
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      console.log('Login payload:', { email, password: password ? '***' + password.slice(-2) : 'empty' });
      
      if (!email || !password) {
        console.log('VALIDATION FAILED: Missing email or password');
        alert('Please fill in email and password');
        return;
      }
      
      // Get redirect parameter from URL
      const urlParams = new URLSearchParams(window.location.search);
      const redirectTo = urlParams.get('redirect');
      
      const endpoint = '/api/login';
      const requestOptions = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ 
          email, 
          password,
          redirect: redirectTo 
        })
      };
      
      console.log('Making request to:', endpoint);
      console.log('Request options:', { 
        method: requestOptions.method, 
        credentials: requestOptions.credentials,
        headers: requestOptions.headers,
        bodyLength: requestOptions.body.length 
      });
      
      try {
        const response = await fetch(endpoint, requestOptions);
        
        console.log('Response received:');
        console.log('- Status:', response.status);
        console.log('- Status Text:', response.statusText);
        console.log('- Headers:', Object.fromEntries(response.headers.entries()));
        console.log('- URL:', response.url);
        
        let data;
        try {
          data = await response.json();
          console.log('Response JSON:', data);
        } catch (jsonError) {
          console.log('Failed to parse JSON response:', jsonError);
          const textResponse = await response.text();
          console.log('Response text:', textResponse);
          throw new Error(`Invalid JSON response: ${textResponse}`);
        }
        
        // DEV vs PROD BEHAVIOR
        const isDevEnvironment = window.location.hostname === 'localhost' || 
                                window.location.hostname.startsWith('192.168.') ||
                                window.location.hostname.startsWith('127.0.0.1');
        
        console.log('Environment detection:', { 
          hostname: window.location.hostname, 
          isDevEnvironment 
        });
        
        // SUCCESS CONDITION: Accept either 200 + ok JSON, or Set-Cookie success
        const isSuccess = response.ok && (
          (data && (data.user || data.token || data.ok)) ||  // JSON success indicators
          response.headers.get('set-cookie')                 // Cookie-based success
        );
        
        console.log('Success evaluation:', {
          responseOk: response.ok,
          hasUserData: !!(data && data.user),
          hasToken: !!(data && data.token),
          hasOkFlag: !!(data && data.ok),
          hasSetCookie: !!response.headers.get('set-cookie'),
          isSuccess
        });
        
        if (isSuccess) {
          console.log('LOGIN SUCCESS CONFIRMED!');
          
          // Store user data in localStorage for consistency
          if (data.user) {
            localStorage.setItem('videobossUserId', data.user.id);
            localStorage.setItem('videobossEmail', data.user.email);
            localStorage.setItem('videobossUser', JSON.stringify(data.user));
          }
          if (data.token) {
            localStorage.setItem('videobossToken', data.token);
          }
          
          // DEV ENVIRONMENT: Set in-memory auth state if no cookie
          if (isDevEnvironment && !response.headers.get('set-cookie')) {
            console.log('DEV MODE: Setting localStorage auth state (no cookie detected)');
            localStorage.setItem('videobossAuthState', 'authenticated');
            localStorage.setItem('videobossAuthTimestamp', Date.now().toString());
          }
          
          // Update mobile navbar if function exists
          if (typeof window.updateMobileNavbar === 'function') {
            console.log('Updating mobile navbar...');
            window.updateMobileNavbar();
          }
          
          // Handle Remember Me functionality
          if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('rememberedEmail', email);
          } else {
            localStorage.removeItem('rememberedEmail');
          }
          
          // Determine redirect destination
          const urlParams = new URLSearchParams(window.location.search);
          const redirectTo = urlParams.get('redirect');
          const intent = urlParams.get('intent');
          
          console.log('Redirect params:', { redirectTo, intent });
          
          let redirectUrl = 'analyzer.html'; // Default fallback
          
          if (redirectTo && redirectTo.startsWith('/') && !redirectTo.includes('..')) {
            redirectUrl = redirectTo;
            console.log('Using redirectTo:', redirectUrl);
          } else if (intent === 'affiliate') {
            redirectUrl = 'affiliate-dashboard.html';
            console.log('Using affiliate intent:', redirectUrl);
          } else {
            console.log('Using default fallback:', redirectUrl);
          }
          
          console.log('Final redirect URL:', redirectUrl);
          
          // Execute redirect with enhanced QA hooks
          setTimeout(() => {
            console.log('Executing redirect to:', redirectUrl);
            
            // QA HOOKS: Comprehensive debugging
            const currentPath = window.location.pathname;
            const hasCookie = document.cookie.includes('connect.sid') || document.cookie.includes('session');
            const hasToken = !!localStorage.getItem('videobossToken');
            const hasAuthState = !!localStorage.getItem('videobossAuthState');
            
            console.log('QA DEBUG INFO:', {
              currentPath,
              redirectTarget: redirectUrl,
              hasCookie,
              hasToken,
              hasAuthState,
              isDevEnvironment,
              cookieDomain: document.cookie
            });
            
            if (currentPath.includes('login.html')) {
              console.warn('QA WARNING: Login successful but still on login page!', {
                redirectTarget: redirectUrl,
                hasCookie,
                hasToken,
                hasAuthState,
                isDevEnvironment
              });
            }
            
            window.location.href = redirectUrl;
          }, 100);
          
        } else {
          console.log('LOGIN FAILED - Server Response:', {
            status: response.status,
            statusText: response.statusText,
            data: data,
            headers: Object.fromEntries(response.headers.entries())
          });
          
          let errorMessage = 'Login failed';
          if (data && data.error) {
            errorMessage += ': ' + data.error;
          } else if (response.status === 401) {
            errorMessage += ': Invalid email or password';
          } else if (response.status === 403) {
            errorMessage += ': Access forbidden';
          } else if (response.status >= 500) {
            errorMessage += ': Server error';
          } else {
            errorMessage += `: HTTP ${response.status}`;
          }
          
          alert(errorMessage);
        }
      } catch (error) {
        console.error('LOGIN ERROR - Exception caught:', {
          message: error.message,
          stack: error.stack,
          name: error.name
        });
        alert('Network error: ' + error.message);
      }
    }
    
    // Set up button click handler (backup for form submission)
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, setting up login handler');
      const signInBtn = document.getElementById('signInBtn');
      if (signInBtn) {
        console.log('Sign In button found:', signInBtn);
        
        // Add form submission handler as backup
        document.getElementById('loginForm').addEventListener('submit', function(e) {
          e.preventDefault();
          simpleLogin();
        });
        
        console.log('Login handlers attached');
      } else {
        console.log('ERROR: Sign In button not found!');
      }
    });
    
    // REMOVED: Old handleLogin function - using simpleLogin instead
    
    function showAlert(message, type) {
      const alertContainer = document.getElementById('alertContainer');
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.textContent = message;
      alertContainer.appendChild(alertDiv);
    }
    
    // Preserve affiliate intent when clicking signup link
    document.addEventListener('DOMContentLoaded', function() {
      const signupLink = document.getElementById('signupLink');
      if (signupLink) {
        const urlParams = new URLSearchParams(window.location.search);
        const intent = urlParams.get('intent');
        const redirect = urlParams.get('redirect');
        
        if (intent === 'affiliate' || redirect) {
          let signupUrl = 'signup.html?';
          if (redirect) {
            signupUrl += 'redirect=' + encodeURIComponent(redirect);
          }
          if (intent === 'affiliate') {
            if (redirect) signupUrl += '&';
            signupUrl += 'intent=affiliate';
          }
          signupLink.href = signupUrl;
          console.log('Updated signup link to:', signupUrl);
        }
      }
    });

    // Particle Animation and Remember Me functionality
    document.addEventListener('DOMContentLoaded', function() {
      // Handle Remember Me functionality
      const remembered = localStorage.getItem('rememberedEmail');
      if (remembered) {
        document.getElementById('email').value = remembered;
        document.getElementById('rememberMe').checked = true;
      }
      
      const particles = document.querySelector('.particles');
      
      function createParticles() {
        // Clear existing particles
        particles.innerHTML = '';
        
        // Create 20 particles
        for (let i = 0; i < 20; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          
          // Random position
          const left = Math.random() * 100;
          const top = Math.random() * 100;
          
          // Random size
          const size = Math.random() * 4 + 2;
          
          // Random animation delay
          const delay = Math.random() * 6;
          
          particle.style.left = left + '%';
          particle.style.top = top + '%';
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.animationDelay = delay + 's';
          
          particles.appendChild(particle);
        }
      }
      
      createParticles();
    });

    // Modal functions
    function openModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.add('show');
        }, 10);
        document.body.style.overflow = 'hidden';
    }

    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.remove('show');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
        document.body.style.overflow = '';
    }

    // Close modal on ESC key
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            const openModals = document.querySelectorAll('.modal.show');
            openModals.forEach(modal => {
                closeModal(modal.id);
            });
        }
    });

    // Close modal when clicking outside
    document.addEventListener('click', function(event) {
        if (event.target.classList.contains('modal-overlay')) {
            const modal = event.target.parentElement;
            closeModal(modal.id);
        }
    });
  </script>




</body>
