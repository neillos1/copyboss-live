<!-- Simple Cookie Settings modal -->
<div id="modal-cookies" class="modal" role="dialog" aria-hidden="true" style="display:none;position:fixed;z-index:9999;left:50%;top:10%;transform:translateX(-50%);max-width:560px;width:92%;background:#111;color:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)">
  <div class="modal-content" role="document" style="padding:20px;">
    <button type="button" class="modal-close" data-close-modal="#modal-cookies" aria-label="Close" style="position:absolute;right:12px;top:10px;font-size:22px;background:transparent;border:0;color:#fff;cursor:pointer">×</button>
    <h3 style="margin:0 0 8px;font-size:20px;">Cookie settings</h3>
    <p style="margin:0 0 14px;opacity:.9">Manage your preferences or read our
      <a href="/cookie-policy.html" target="_blank" rel="noopener" style="text-decoration:underline;color:#fff">cookie policy</a>.
    </p>
    <div class="cookie-controls" style="display:flex;gap:10px;flex-wrap:wrap">
      <button type="button" class="btn" onclick="window.closeCookieModal && closeCookieModal()" style="padding:10px 14px;border-radius:10px;border:1px solid #444;background:#1e1e1e;color:#fff;cursor:pointer">Allow essential only</button>
      <button type="button" class="btn" onclick="window.closeCookieModal && closeCookieModal()" style="padding:10px 14px;border-radius:10px;border:0;background:#3a82f6;color:#fff;cursor:pointer">Allow all</button>
    </div>
  </div>
</div>
<!-- Uses existing .modal-overlay if present; cookie-modal.js creates one if missing -->
